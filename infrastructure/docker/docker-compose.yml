version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_management
      POSTGRES_USER: school_management
      POSTGRES_PASSWORD: ${DB_PASS:-change-me-in-production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_management -d school_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    container_name: smis-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SchoolManagement: "Host=postgres;Port=5432;Database=school_management;Username=school_management;Password=${DB_PASS:-change-me-in-production}"
      Authentication__JwtKey: ${JWT_KEY:-change-me-in-production-32-chars-minimum}
      EmailService__BaseUrl: http://email-service:5100
      EmailService__ApiKey: ${EMAIL_SERVICE_API_KEY:?Set EMAIL_SERVICE_API_KEY in .env}
      Security__DataProtectionKeysPath: /app/dataprotection-keys
      LibraryIntegrations__Koha__Enabled: "false"
      LibraryIntegrations__DSpace__Enabled: "false"
      DocumentStorage__RootPath: /app/documents
      AttendanceQr__SigningSecret: ${QR_SIGNING_SECRET:-change-me-in-production}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      email-service:
        condition: service_healthy
    volumes:
      - smis_logs:/app/logs
      - smis_documents:/app/documents
      - smis_dataprotection:/app/dataprotection-keys
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  email-service:
    build:
      context: ../..
      dockerfile: services/email-service/Dockerfile
    container_name: smis-email-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5100
      EMAIL_SERVICE_HOST: 0.0.0.0
      EMAIL_SERVICE_API_KEY: ${EMAIL_SERVICE_API_KEY:?Set EMAIL_SERVICE_API_KEY in .env}
    expose:
      - "5100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    container_name: smis-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  smis_logs:
  smis_documents:
  smis_dataprotection:
