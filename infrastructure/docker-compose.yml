version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_management
      POSTGRES_USER: school_management
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeThisPassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SchoolManagement: "Host=db;Port=5432;Database=school_management;Username=school_management;Password=${POSTGRES_PASSWORD:-ChangeThisPassword}"
      Authentication__JwtKey: ${JWT_KEY}
      EmailService__BaseUrl: http://email-service:5100
      EmailService__ApiKey: ${EMAIL_SERVICE_API_KEY:?Set EMAIL_SERVICE_API_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
      email-service:
        condition: service_healthy

  email-service:
    build:
      context: ..
      dockerfile: services/email-service/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5100
      EMAIL_SERVICE_HOST: 0.0.0.0
      EMAIL_SERVICE_API_KEY: ${EMAIL_SERVICE_API_KEY:?Set EMAIL_SERVICE_API_KEY in .env}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - webassets:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  pgdata:
  webassets:
