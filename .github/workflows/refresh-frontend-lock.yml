name: Temporary frontend lockfile refresh

on:
  push:
    branches: [chore/system-audit-ci-coverage]
    paths:
      - 'frontend/package.json'

permissions:
  contents: read

jobs:
  refresh-lockfile:
    if: github.ref == 'refs/heads/chore/system-audit-ci-coverage'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate locked dependency graph
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit updated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Frontend lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore(deps): refresh frontend lockfile"
          git push origin HEAD:refs/heads/chore/system-audit-ci-coverage
