name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/**']
    paths:
      - 'frontend/**'
      - 'setup.ps1'
      - 'setup.sh'
      - 'update.ps1'
      - 'update.sh'
      - 'README.md'
      - 'INSTALLATION.md'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Validate React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend unit and component tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Analyze bundle sizes
        run: npm run build:analyze

      - name: Upload bundle stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-stats
          path: frontend/dist/stats.html

      - name: Install Playwright for accessibility tests
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: npx playwright test --config=playwright-a11y.config.ts --reporter=line

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=low
