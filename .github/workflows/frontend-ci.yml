name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'setup.ps1'
      - 'setup.sh'
      - 'update.ps1'
      - 'update.sh'
      - 'README.md'
      - 'INSTALLATION.md'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Validate React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply non-breaking security updates to the dependency lockfile
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend unit and component tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Upload generated lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
  refresh-lockfile:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'chore/system-audit-ci-coverage' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'Quranhub1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: chore/system-audit-ci-coverage

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile update
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Frontend lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore(deps): refresh frontend lockfile"
          git push origin HEAD:refs/heads/chore/system-audit-ci-coverage

