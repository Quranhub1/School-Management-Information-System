name: Create v0.2.0 Release Tag

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate v0.2.0 tag on corrected release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.2.0"
          TARGET="${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${TAG}" "${TARGET}"
          git push origin "refs/tags/${TAG}" --force
          echo "Created ${TAG} at ${TARGET}"

      - name: Dispatch desktop release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run desktop-tauri-ci.yml --ref v0.2.0
          echo "Dispatched desktop release workflow for v0.2.0"
