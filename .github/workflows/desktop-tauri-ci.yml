name: Native Desktop Client CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/desktop-tauri-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/desktop-tauri-ci.yml'

jobs:
  windows:
    name: Windows ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [i686-pc-windows-msvc, x86_64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build native client
        working-directory: frontend
        run: npx @tauri-apps/cli@2.8.4 build --target ${{ matrix.target }} --no-bundle

  ubuntu:
    name: Ubuntu Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build native client
        working-directory: frontend
        run: npx @tauri-apps/cli@2.8.4 build --no-bundle
