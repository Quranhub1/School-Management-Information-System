name: Generate EF Core Migrations

on:
  workflow_dispatch:
    inputs:
      migration_name:
        description: 'Name for the new migration'
        required: true
        default: 'InitialCreate'

permissions:
  contents: write

jobs:
  generate:
    name: Generate and commit migration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend
        working-directory: backend
        run: dotnet restore SchoolManagement.sln

      - name: Restore EF Core CLI
        working-directory: backend
        run: dotnet tool restore

      - name: Generate migration
        working-directory: backend
        run: |
          dotnet ef migrations add ${{ github.event.inputs.migration_name }} \
            --project src/SchoolManagement.Infrastructure/SchoolManagement.Infrastructure.csproj \
            --startup-project src/SchoolManagement.Api/SchoolManagement.Api.csproj \
            --output-dir Migrations

      - name: Commit migration
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/SchoolManagement.Infrastructure/Migrations
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(db): add EF Core migration ${{ github.event.inputs.migration_name }}"
          git push
