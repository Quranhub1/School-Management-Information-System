name: Generate EF Core Migrations

on:
  workflow_dispatch:
    inputs:
      migration_name:
        description: 'Name for the new migration'
        required: true
        default: 'InitialCreate'

permissions:
  contents: read

jobs:
  generate:
    name: Generate and commit migration
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MIGRATION_NAME: ${{ inputs.migration_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend
        working-directory: backend
        run: dotnet restore SchoolManagement.sln

      - name: Restore EF Core CLI
        working-directory: backend
        run: dotnet tool restore

      - name: Generate migration
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$MIGRATION_NAME" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]]; then
            echo "Migration name must start with a letter and contain only letters, numbers, or underscores."
            exit 1
          fi
          dotnet ef migrations add "$MIGRATION_NAME" \
            --project src/SchoolManagement.Infrastructure/SchoolManagement.Infrastructure.csproj \
            --startup-project src/SchoolManagement.Api/SchoolManagement.Api.csproj \
            --output-dir Migrations

      - name: Commit migration
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/src/SchoolManagement.Infrastructure/Migrations
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(db): add EF Core migration $MIGRATION_NAME"
          git push
