name: Desktop Client CI

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore desktop client
        run: dotnet restore desktop/SchoolManagement.Desktop/SchoolManagement.Desktop.csproj

      - name: Build desktop client
        run: dotnet build desktop/SchoolManagement.Desktop/SchoolManagement.Desktop.csproj --configuration Release --no-restore
