name: Foundation CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'foundation/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    name: Validate project foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required foundation files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            README.md
            .gitignore
            .editorconfig
            docs/ARCHITECTURE.md
            docs/REQUIREMENTS.md
            docs/DATABASE.md
            docs/API.md
            docs/SECURITY.md
            docs/DEPLOYMENT.md
          )
          for file in "${required_files[@]}"; do
            test -f "$file"
            echo "Found $file"
          done

      - name: Validate architecture directories
        shell: bash
        run: |
          set -euo pipefail
          test -d docs
          test -d docs/adr
          test -d .github/workflows
          echo "Project foundation directories are present."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend
        working-directory: backend
        run: dotnet restore SchoolManagement.sln

      - name: Build backend
        working-directory: backend
        run: dotnet build SchoolManagement.sln --configuration Release --no-restore

      - name: Restore pinned EF Core CLI
        working-directory: backend
        run: dotnet tool restore

      - name: Validate EF Core model can scaffold
        working-directory: backend
        run: |
          set -euo pipefail
          rm -rf /tmp/smism-migrations
          dotnet ef migrations add CiModelValidation \
            --project src/SchoolManagement.Infrastructure/SchoolManagement.Infrastructure.csproj \
            --configuration Release \
            --output-dir /tmp/smism-migrations \
            --no-build
          test -f /tmp/smism-migrations/*_CiModelValidation.cs
          dotnet ef migrations script \
            --project src/SchoolManagement.Infrastructure/SchoolManagement.Infrastructure.csproj \
            --configuration Release \
            --output /tmp/smism-schema.sql \
            --no-build
          test -s /tmp/smism-schema.sql
          echo "EF Core model successfully scaffolds and generates SQL."
