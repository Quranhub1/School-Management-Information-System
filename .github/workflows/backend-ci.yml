name: Backend CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  ConnectionStrings__SchoolManagement: Host=127.0.0.1;Port=5432;Database=school_management_ci;Username=school_management;Password=ci_validation
  Authentication__JwtKey: ci-only-jwt-signing-key-that-is-long-enough-for-hmac-sha256-validation
  SEED_ADMIN_PASSWORD: ci-admin-password-for-tests-only
  SMIS_ATTENDANCE_QR_SECRET: ci-attendance-qr-secret-for-tests-only
  Security__AttendanceQrSecret: ci-attendance-qr-secret-for-tests-only

jobs:
  build:
    name: Build backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        working-directory: backend
        run: dotnet restore SchoolManagement.sln
      - name: Build
        working-directory: backend
        run: dotnet build SchoolManagement.sln --configuration Release --no-restore

  test:
    name: Run backend tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: school_management_ci
          POSTGRES_USER: school_management
          POSTGRES_PASSWORD: ci_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U school_management -d school_management_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        working-directory: backend
        run: dotnet restore SchoolManagement.sln
      - name: Restore pinned EF Core CLI
        working-directory: backend
        run: dotnet tool restore
      - name: Apply database migrations
        working-directory: backend
        run: dotnet ef database update --project src/SchoolManagement.Infrastructure/SchoolManagement.Infrastructure.csproj --startup-project src/SchoolManagement.Api/SchoolManagement.Api.csproj --configuration Release
      - name: Test
        working-directory: backend
        run: dotnet test SchoolManagement.sln --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
          if-no-files-found: warn
