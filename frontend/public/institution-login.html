<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institution Login Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 font-sans text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden p-8">
        
        <!-- Header with Official Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-white/5 p-2 mb-4 border border-slate-700 shadow-inner">
                <img src="https://www.kshs.ac.ug/images/kampala%20logo.png" alt="Institution Logo" class="w-full h-full object-contain" onerror="this.onerror=null; this.src='https://placehold.co/80x80/1e293b/ffffff?text=KSHS';">
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Institution Portal</h1>
            <p class="text-sm text-slate-400 mt-1">Sign in to access your institutional dashboard</p>
        </div>

        <!-- Notification Message Box -->
        <div id="messageBox" class="hidden mb-6 p-4 rounded-xl text-sm border transition-all duration-300"></div>

        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Portal ID / Email</label>
                <input type="text" id="username" required placeholder="Enter institutional ID or email"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Password</label>
                <input type="password" id="password" required placeholder="••••••••••••"
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center text-slate-400 cursor-pointer">
                    <input type="checkbox" class="rounded bg-slate-900 border-slate-700 text-blue-600 focus:ring-blue-500 mr-2">
                    Remember me
                </label>
                <a href="#" onclick="showMsg('Password reset instructions sent to registered admin.', 'info')" class="text-blue-400 hover:underline">Forgot password?</a>
            </div>

            <button type="submit" 
                class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/25 transition-all transform active:scale-[0.98]">
                Access Portal
            </button>
        </form>

        <div class="mt-8 text-center border-t border-slate-700/60 pt-6">
            <p class="text-xs text-slate-500">Secure Institutional Network • Authorized Access Only</p>
        </div>
    </div>

    <script>
        function showMsg(text, type = 'error') {
            const box = document.getElementById('messageBox');
            box.textContent = text;
            box.className = `mb-6 p-4 rounded-xl text-sm border block ${
                type === 'error' 
                    ? 'bg-red-900/30 border-red-500/50 text-red-200' 
                    : 'bg-blue-900/30 border-blue-500/50 text-blue-200'
            }`;
            setTimeout(() => {
                box.className = 'hidden mb-6 p-4 rounded-xl text-sm border';
            }, 4000);
        }

        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (!user || !pass) {
                showMsg('Please fill in all required fields.', 'error');
                return;
            }

            showMsg('Authentication successful. Loading workspace...', 'info');
            setTimeout(() => {
                document.getElementById('loginForm').reset();
                showMsg('Logged in successfully to institution dashboard.', 'info');
            }, 1500);
        }
    </script>
</body>
</html>
