<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institution Login Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for the digital clock icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Glassmorphism Surface */
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 20px 40px -15px rgba(30, 41, 59, 0.1);
        }

        .glass-modal {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 35px 60px -15px rgba(15, 23, 42, 0.25);
        }

        /* Purposeful Card Lift */
        .hover-lift {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(30, 41, 59, 0.16);
        }

        /* Logo Interactive Float */
        .logo-interactive {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        .logo-interactive:hover {
            transform: scale(1.06) rotate(2deg);
            box-shadow: 0 12px 24px -6px rgba(37, 99, 235, 0.25);
        }

        /* Tactile Action Button */
        .btn-primary {
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1), filter 0.2s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -6px rgba(37, 99, 235, 0.4);
            filter: brightness(1.04);
        }
        .btn-primary:active {
            transform: translateY(0);
            filter: brightness(0.97);
        }

        /* Background Canvas */
        canvas#bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }
    
        /* Historical clock animation support */
        @keyframes enterSlideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-enter {
            opacity: 0;
            transform: translateY(20px);
            animation: enterSlideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .delay-5 { animation-delay: 0.5s; }
        .animate-spin-slow { animation: spin 12s linear infinite; }
    </style>
</head>
<body class="bg-gradient-to-br from-sky-50 via-indigo-50/50 to-blue-100 font-sans text-slate-800 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Uniform Stratified Canvas Background with Spinning Watermarks -->
    <canvas id="bgCanvas" aria-hidden="true"></canvas>

    <!-- Main Login Card -->
    <main class="w-full max-w-md glass-card rounded-3xl overflow-hidden p-8 sm:p-10 relative z-10 hover-lift">
        
        <!-- Header with Centered Interactive Logo -->
        <header class="text-center mb-8 flex flex-col items-center justify-center">
            <div class="logo-interactive flex items-center justify-center w-24 h-24 rounded-2xl bg-white p-3 mb-4 border border-slate-200/90 shadow-md cursor-pointer">
                <img id="displayLogo" 
                     src="https://www.kshs.ac.ug/images/kampala%20logo.png" 
                     alt="Institution Logo" 
                     class="w-full h-full object-contain filter drop-shadow" 
                     onerror="this.onerror=null; this.src='https://placehold.co/80x80/f1f5f9/1e293b?text=LOGO';">
            </div>
            <h1 id="displayName" class="text-2xl font-extrabold tracking-tight text-slate-900 bg-gradient-to-r from-slate-900 via-blue-950 to-indigo-900 bg-clip-text text-transparent text-center leading-tight">
                INSTITUTION NAME
            </h1>
            <!-- Unlocked casing motto: supports uppercase, lowercase, and mixed case -->
            <p id="displayMotto" class="text-xs tracking-wide text-blue-600 font-semibold mt-1.5 text-center transition-colors duration-200 hover:text-blue-700 cursor-default">
                Excellence & Integrity
            </p>
        </header>

        <!-- Dynamic Message Box -->
        <div id="messageBox" role="alert" aria-live="polite" class="hidden mb-6 p-4 rounded-2xl text-sm border transition-all duration-300"></div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5" novalidate>
            <div>
                <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2 transition-colors duration-200 hover:text-slate-800">
                    Username
                </label>
                <div class="relative">
                    <input type="text" id="username" name="username" required placeholder="Enter your credentials"
                        class="w-full bg-white/90 hover:bg-white border border-slate-200 hover:border-slate-300 rounded-xl px-4 py-3.5 text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-600/15 transition-colors duration-200 shadow-sm">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2 transition-colors duration-200 hover:text-slate-800">
                    Password
                </label>
                <div class="relative">
                    <input type="password" id="password" name="password" required placeholder="••••••••••••"
                        class="w-full bg-white/90 hover:bg-white border border-slate-200 hover:border-slate-300 rounded-xl px-4 py-3.5 text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-600/15 transition-colors duration-200 shadow-sm">
                </div>
            </div>

            <div class="flex items-center justify-between text-sm pt-1">
                <label for="rememberMe" class="group flex items-center text-slate-600 cursor-pointer select-none transition-colors duration-150 hover:text-slate-900">
                    <input type="checkbox" id="rememberMe" name="rememberMe" 
                           class="rounded bg-white border-slate-300 text-blue-600 focus:ring-blue-500 w-4 h-4 mr-2 transition-colors group-hover:border-blue-400 cursor-pointer">
                    Remember me
                </label>
                <button type="button" onclick="showMsg('Password reset link sent to your registered email.', 'info')" 
                        class="text-blue-600 hover:text-blue-800 font-semibold hover:underline text-sm focus:outline-none transition-colors duration-150 transform active:scale-95">
                    Forgot password?
                </button>
            </div>

            <button type="submit" id="submitBtn"
                class="btn-primary w-full py-4 px-4 bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-700 text-white font-bold tracking-wide rounded-xl shadow-lg shadow-blue-600/25 uppercase text-sm focus:outline-none focus:ring-4 focus:ring-blue-600/25">
                SIGN IN
            </button>
        </form>

        <!-- Live Digital Clock -->
        <div class="animate-enter delay-5 mt-6 text-center">
            <div id="digitalClockContainer" class="inline-flex items-center space-x-2 px-4 py-1.5 rounded-full bg-emerald-50/80 border border-emerald-200/80 backdrop-blur-md shadow-sm hover:scale-105 transition-transform duration-300">
                <i class="fa-regular fa-clock text-emerald-600 animate-spin-slow text-xs"></i>
                <span id="digitalClockTime" class="font-mono text-xs font-semibold tracking-wider text-emerald-950">--:--:-- --</span>
                <span class="text-emerald-300">|</span>
                <span id="digitalClockDate" class="font-sans text-xs text-emerald-700 font-medium">--- --, ----</span>
            </div>
        </div>

        <footer class="mt-8 text-center border-t border-slate-200/80 pt-6">
            <p class="text-xs text-slate-500 font-medium tracking-wide">
                Designed by <span class="text-blue-600 font-bold transition-colors duration-200 hover:text-indigo-700 hover:underline cursor-pointer">JOES TECHNOLOGIES</span>
            </p>
        </footer>
    </main>

    <script>
        (() => {
            const params = new URLSearchParams(window.location.search);
            const apiBase = (params.get('api') || window.location.origin).replace(/\/$/, '');
            const parentOrigin = window.location.origin;

            window.showMsg = function showMsg(message, type = 'info') {
                const box = document.getElementById('messageBox');
                if (!box) return;
                box.textContent = message;
                box.classList.remove('hidden');
                box.className = 'mb-6 p-4 rounded-2xl text-sm border transition-all duration-300';
                if (type === 'error') box.classList.add('bg-red-50', 'border-red-200', 'text-red-700');
                else if (type === 'success') box.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
                else box.classList.add('bg-blue-50', 'border-blue-200', 'text-blue-700');
            };

            window.handleLogin = async function handleLogin(event) {
                event.preventDefault();
                const submitButton = document.getElementById('submitBtn');
                const usernameInput = document.getElementById('username');
                const passwordInput = document.getElementById('password');
                const rememberMe = document.getElementById('rememberMe');
                const username = usernameInput?.value.trim() || '';
                const password = passwordInput?.value || '';
                if (!username || !password) {
                    window.showMsg('Please enter your username and password.', 'error');
                    return;
                }
                if (submitButton) { submitButton.disabled = true; submitButton.textContent = 'SIGNING IN...'; }
                try {
                    const response = await fetch(apiBase + '/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const payload = await response.json().catch(() => null);
                    if (!response.ok) throw new Error(payload?.message || 'Invalid username or password.');
                    if (!payload?.accessToken || !payload?.username || !Array.isArray(payload?.roles)) throw new Error('The server returned an invalid login response.');
                    if (rememberMe?.checked) localStorage.setItem('smis.rememberedUsername', username);
                    else localStorage.removeItem('smis.rememberedUsername');
                    window.parent.postMessage({ type: 'smis-login', session: payload }, parentOrigin);
                    window.showMsg('Signed in successfully.', 'success');
                } catch (error) {
                    window.showMsg(error instanceof Error ? error.message : 'Unable to sign in.', 'error');
                } finally {
                    if (submitButton) { submitButton.disabled = false; submitButton.textContent = 'SIGN IN'; }
                }
            };

            // REAL-TIME DIGITAL CLOCK FUNCTION
            function updateDigitalClock() {
                const now = new Date();
                const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
                const dateOptions = { month: 'short', day: 'numeric', year: 'numeric' };

                const timeEl = document.getElementById('digitalClockTime');
                const dateEl = document.getElementById('digitalClockDate');
                if (timeEl) timeEl.textContent = now.toLocaleTimeString('en-US', timeOptions);
                if (dateEl) dateEl.textContent = now.toLocaleDateString('en-US', dateOptions);
            }

            // Immediately run and interval tick every 1000ms
            updateDigitalClock();
            setInterval(updateDigitalClock, 1000);

            async function loadInstitutionBranding() {
                try {
                    const response = await fetch(apiBase + '/api/public/institution-settings/active', {
                        headers: { Accept: 'application/json' },
                        cache: 'no-store'
                    });
                    if (!response.ok) return;
                    const settings = await response.json();
                    const name = typeof settings?.institutionName === 'string' && settings.institutionName.trim()
                        ? settings.institutionName.trim()
                        : 'INSTITUTION NAME';
                    const motto = typeof settings?.motto === 'string' && settings.motto.trim()
                        ? settings.motto.trim()
                        : 'Excellence & Integrity';
                    const abbreviation = typeof settings?.abbreviation === 'string' && settings.abbreviation.trim()
                        ? settings.abbreviation.trim()
                        : '';

                    const nameElement = document.getElementById('displayName');
                    const mottoElement = document.getElementById('displayMotto');
                    const logoElement = document.getElementById('displayLogo');
                    if (nameElement) nameElement.textContent = name;
                    if (mottoElement) mottoElement.textContent = motto;

                    if (logoElement && typeof settings?.logoPath === 'string' && settings.logoPath.trim()) {
                        const logoUrl = new URL(settings.logoPath.trim(), apiBase || window.location.origin);
                        if (settings.updatedAt) logoUrl.searchParams.set('v', settings.updatedAt);
                        logoElement.src = logoUrl.toString();
                        logoElement.alt = name + ' Logo';
                    }

                    const primary = typeof settings?.primaryColor === 'string' && settings.primaryColor.trim()
                        ? settings.primaryColor.trim()
                        : '#2563eb';
                    const accent = typeof settings?.accentColor === 'string' && settings.accentColor.trim()
                        ? settings.accentColor.trim()
                        : '#4f46e5';

                    document.documentElement.style.setProperty('--login-primary', primary);
                    ['orb1','orb2','orb3','orb4'].forEach((id) => {
                        const orb = document.getElementById(id);
                        if (orb) orb.style.setProperty('background-color', primary + '26');
                    });
                    document.documentElement.style.setProperty('--login-accent', accent);
                    document.body.style.background = 'linear-gradient(135deg, color-mix(in srgb, ' + primary + ' 8%, white), color-mix(in srgb, ' + accent + ' 10%, #eef2ff), color-mix(in srgb, ' + primary + ' 16%, #dbeafe))';

                    const submitButton = document.getElementById('submitBtn');
                    if (submitButton) {
                        submitButton.style.background = 'linear-gradient(90deg, ' + primary + ', ' + accent + ', ' + primary + ')';
                    }

                    if (abbreviation) {
                        document.title = abbreviation + ' — ' + name;
                    } else {
                        document.title = name;
                    }
                } catch {
                    // Keep existing default branding if fetch fails
                }
            }

            void loadInstitutionBranding();
            window.setInterval(loadInstitutionBranding, 30000);

            const rememberedUsername = localStorage.getItem('smis.rememberedUsername');
            const usernameInput = document.getElementById('username');
            const rememberMe = document.getElementById('rememberMe');
            if (rememberedUsername && usernameInput) { usernameInput.value = rememberedUsername; if (rememberMe) rememberMe.checked = true; }

            // =========================================================================
            // ADVANCED CANVAS WATERMARK ENGINE (16-Sector Stratified Grid & Spinning)
            // =========================================================================
            const canvas = document.getElementById('bgCanvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                let dpr = window.devicePixelRatio || 1;

                const COLS = 4; // 4 columns across
                const ROWS = 4; // 4 rows down = 16 balanced sectors
                let watermarks = [];

                function initWatermarks() {
                    watermarks = [];
                    const cellW = window.innerWidth / COLS;
                    const cellH = window.innerHeight / ROWS;

                    for (let r = 0; r < ROWS; r++) {
                        for (let c = 0; c < COLS; c++) {
                            const index = r * COLS + c;
                            watermarks.push({
                                type: index % 2 === 0 ? 'name' : 'motto',
                                col: c,
                                row: r,
                                homeX: (c + 0.5) * cellW,
                                homeY: (r + 0.5) * cellH,
                                radiusX: cellW * 0.22,
                                radiusY: cellH * 0.22,
                                speedX: Math.random() * 0.0007 + 0.0005,
                                speedY: Math.random() * 0.0007 + 0.0005,
                                phaseX: Math.random() * Math.PI * 2,
                                phaseY: Math.random() * Math.PI * 2,
                                angle: Math.random() * Math.PI * 2, // 360-degree randomized start angle
                                spinSpeed: (Math.random() - 0.5) * 0.0024 + (Math.random() > 0.5 ? 0.0008 : -0.0008), // Smooth spin
                                fontSize: index % 2 === 0 ? Math.floor(Math.random() * 6) + 22 : Math.floor(Math.random() * 5) + 18,
                                opacity: Math.random() * 0.025 + 0.035
                            });
                        }
                    }
                }

                function resizeCanvas() {
                    dpr = window.devicePixelRatio || 1;
                    canvas.width = window.innerWidth * dpr;
                    canvas.height = window.innerHeight * dpr;
                    canvas.style.width = window.innerWidth + 'px';
                    canvas.style.height = window.innerHeight + 'px';
                    ctx.scale(dpr, dpr);

                    // Re-anchor home positions on resize
                    const cellW = window.innerWidth / COLS;
                    const cellH = window.innerHeight / ROWS;
                    watermarks.forEach(w => {
                        w.homeX = (w.col + 0.5) * cellW;
                        w.homeY = (w.row + 0.5) * cellH;
                        w.radiusX = cellW * 0.22;
                        w.radiusY = cellH * 0.22;
                    });
                }

                initWatermarks();
                window.addEventListener('resize', resizeCanvas);
                resizeCanvas();

                // Subtle organic ambient bubbles
                const bubbleCount = 8;
                const bubbles = Array.from({ length: bubbleCount }, () => ({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    radius: Math.random() * 40 + 20,
                    maxRadius: Math.random() * 90 + 60,
                    growthSpeed: Math.random() * 0.12 + 0.05,
                    opacity: Math.random() * 0.18 + 0.04,
                    vx: (Math.random() - 0.5) * 0.18,
                    vy: (Math.random() - 0.5) * 0.18
                }));

                function animateBackground(timestamp) {
                    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
                    const time = timestamp || performance.now();

                    // Read active name & motto from DOM dynamically
                    const displayNameEl = document.getElementById('displayName');
                    const displayMottoEl = document.getElementById('displayMotto');
                    const currentName = (displayNameEl?.textContent || 'INSTITUTION NAME').trim();
                    const currentMotto = (displayMottoEl?.textContent || 'Excellence & Integrity').trim();

                    // 1. Draw perfectly distributed, spinning watermarks in all 16 sectors
                    watermarks.forEach(w => {
                        const currentX = w.homeX + Math.sin(time * w.speedX + w.phaseX) * w.radiusX;
                        const currentY = w.homeY + Math.cos(time * w.speedY + w.phaseY) * w.radiusY;
                        w.angle += w.spinSpeed;

                        ctx.save();
                        ctx.translate(currentX, currentY);
                        ctx.rotate(w.angle);

                        const isName = w.type === 'name';
                        const text = isName ? currentName.toUpperCase() : currentMotto;

                        if (isName) {
                            ctx.font = `800 ${w.fontSize}px Inter, sans-serif`;
                            ctx.fillStyle = `rgba(30, 41, 59, ${w.opacity})`;
                        } else {
                            ctx.font = `600 italic ${w.fontSize}px Inter, sans-serif`;
                            ctx.fillStyle = `rgba(37, 99, 235, ${w.opacity * 1.25})`;
                        }

                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(text, 0, 0);
                        ctx.restore();
                    });

                    // 2. Draw subtle background ripple circles
                    bubbles.forEach(b => {
                        b.x += b.vx;
                        b.y += b.vy;
                        b.radius += b.growthSpeed;

                        if (b.x < -150) b.x = window.innerWidth + 150;
                        if (b.x > window.innerWidth + 150) b.x = -150;
                        if (b.y < -150) b.y = window.innerHeight + 150;
                        if (b.y > window.innerHeight + 150) b.y = -150;

                        if (b.radius > b.maxRadius) {
                            b.radius = Math.random() * 20 + 10;
                        }

                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                        ctx.strokeStyle = `rgba(37, 99, 235, ${Math.max(0, b.opacity * (1 - b.radius / b.maxRadius))})`;
                        ctx.lineWidth = 1.2;
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(b.x, b.y, b.radius * 0.3, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(147, 197, 253, ${Math.max(0, (b.opacity * 0.25) * (1 - b.radius / b.maxRadius))})`;
                        ctx.fill();
                    });

                    requestAnimationFrame(animateBackground);
                }

                requestAnimationFrame(animateBackground);
            }
        })();
    </script>
</body>
</html>
