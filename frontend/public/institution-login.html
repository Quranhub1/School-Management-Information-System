<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institution Login Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Glassmorphism Surface */
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 20px 40px -15px rgba(30, 41, 59, 0.1);
        }

        .glass-modal {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 35px 60px -15px rgba(15, 23, 42, 0.25);
        }

        /* Purposeful Card Lift */
        .hover-lift {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 30px 60px -12px rgba(30, 41, 59, 0.16);
        }

        /* Logo Interactive Float */
        .logo-interactive {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        .logo-interactive:hover {
            transform: scale(1.06) rotate(2deg);
            box-shadow: 0 12px 24px -6px rgba(37, 99, 235, 0.25);
        }

        /* Tactile Action Button */
        .btn-primary {
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1), filter 0.2s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -6px rgba(37, 99, 235, 0.4);
            filter: brightness(1.04);
        }
        .btn-primary:active {
            transform: translateY(0);
            filter: brightness(0.97);
        }

        /* Settings Gear Rotation Effect */
        .settings-btn:hover svg {
            transform: rotate(60deg);
        }
        .settings-btn svg {
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Background Canvas */
        canvas#bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-sky-50 via-indigo-50/50 to-blue-100 font-sans text-slate-800 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Uniform Stratified Canvas Background -->
    <canvas id="bgCanvas" aria-hidden="true"></canvas>

    <!-- Settings Gear Button (Top-Right) -->
    <button type="button" onclick="toggleSettingsModal(true)" 
            aria-label="Open Branding Settings"
            class="settings-btn fixed top-5 right-5 z-30 p-3 bg-white/80 hover:bg-white text-slate-600 hover:text-blue-600 rounded-2xl border border-slate-200 shadow-md hover:shadow-xl transition-all duration-300 transform hover:scale-105 active:scale-95 backdrop-blur-md">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
        </svg>
    </button>

    <!-- Main Login Card -->
    <main class="w-full max-w-md glass-card rounded-3xl overflow-hidden p-8 sm:p-10 relative z-10 hover-lift">
        
        <!-- Header with Centered Interactive Logo -->
        <header class="text-center mb-8 flex flex-col items-center justify-center">
            <div class="logo-interactive flex items-center justify-center w-24 h-24 rounded-2xl bg-white p-3 mb-4 border border-slate-200/90 shadow-md cursor-pointer">
                <img id="displayLogo" 
                     src="https://www.kshs.ac.ug/images/kampala%20logo.png" 
                     alt="Institution Logo" 
                     class="w-full h-full object-contain filter drop-shadow" 
                     onerror="this.onerror=null; this.src='https://placehold.co/80x80/f1f5f9/1e293b?text=LOGO';">
            </div>
            <h1 id="displayName" class="text-2xl font-extrabold tracking-tight text-slate-900 bg-gradient-to-r from-slate-900 via-blue-950 to-indigo-900 bg-clip-text text-transparent text-center leading-tight">
                INSTITUTION NAME
            </h1>
            <!-- Unlocked casing motto: supports uppercase, lowercase, and mixed case -->
            <p id="displayMotto" class="text-xs tracking-wide text-blue-600 font-semibold mt-1.5 text-center transition-colors duration-200 hover:text-blue-700 cursor-default">
                Excellence & Integrity
            </p>
        </header>

        <!-- Dynamic Message Box -->
        <div id="messageBox" role="alert" aria-live="polite" class="hidden mb-6 p-4 rounded-2xl text-sm border transition-all duration-300"></div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5" novalidate>
            <div>
                <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2 transition-colors duration-200 hover:text-slate-800">
                    Username / Email
                </label>
                <div class="relative">
                    <input type="text" id="username" name="username" required placeholder="Enter your credentials"
                        class="w-full bg-white/90 hover:bg-white border border-slate-200 hover:border-slate-300 rounded-xl px-4 py-3.5 text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-600/15 transition-colors duration-200 shadow-sm">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-2 transition-colors duration-200 hover:text-slate-800">
                    Password
                </label>
                <div class="relative">
                    <input type="password" id="password" name="password" required placeholder="••••••••••••"
                        class="w-full bg-white/90 hover:bg-white border border-slate-200 hover:border-slate-300 rounded-xl px-4 py-3.5 text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-600/15 transition-colors duration-200 shadow-sm">
                </div>
            </div>

            <div class="flex items-center justify-between text-sm pt-1">
                <label for="rememberMe" class="group flex items-center text-slate-600 cursor-pointer select-none transition-colors duration-150 hover:text-slate-900">
                    <input type="checkbox" id="rememberMe" name="rememberMe" 
                           class="rounded bg-white border-slate-300 text-blue-600 focus:ring-blue-500 w-4 h-4 mr-2 transition-colors group-hover:border-blue-400 cursor-pointer">
                    Remember me
                </label>
                <button type="button" onclick="showMsg('Password reset link sent to your registered email.', 'info')" 
                        class="text-blue-600 hover:text-blue-800 font-semibold hover:underline text-sm focus:outline-none transition-colors duration-150 transform active:scale-95">
                    Forgot password?
                </button>
            </div>

            <button type="submit" id="submitBtn"
                class="btn-primary w-full py-4 px-4 bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-700 text-white font-bold tracking-wide rounded-xl shadow-lg shadow-blue-600/25 uppercase text-sm focus:outline-none focus:ring-4 focus:ring-blue-600/25">
                SIGN IN
            </button>
        </form>

        <footer class="mt-8 text-center border-t border-slate-200/80 pt-6">
            <p class="text-xs text-slate-500 font-medium tracking-wide">
                Designed by <span class="text-blue-600 font-bold transition-colors duration-200 hover:text-indigo-700 hover:underline cursor-pointer">JOES TECHNOLOGIES</span>
            </p>
        </footer>
    </main>

    <!-- Settings Modal Dialog -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden transition-opacity duration-300">
        <div class="w-full max-w-md glass-modal rounded-3xl p-6 sm:p-8 relative">
            <div class="flex items-center justify-between pb-4 border-b border-slate-200">
                <div class="flex items-center space-x-2">
                    <div class="p-2 bg-blue-50 text-blue-600 rounded-lg">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
                        </svg>
                    </div>
                    <h2 class="text-lg font-bold text-slate-900">Portal Customizer</h2>
                </div>
                <button type="button" onclick="toggleSettingsModal(false)" 
                        class="text-slate-400 hover:text-slate-700 p-1.5 rounded-lg hover:bg-slate-100 transition-all duration-150 transform hover:scale-110 active:scale-90">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <div class="space-y-4 my-6">
                <div>
                    <label for="settingInstName" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
                        Institution Name
                    </label>
                    <input type="text" id="settingInstName" oninput="onSettingsChange()" placeholder="e.g. Kampala School of Health Sciences"
                           class="w-full bg-slate-50 hover:bg-white focus:bg-white border border-slate-200 hover:border-slate-300 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 transition-colors duration-150">
                </div>

                <div>
                    <label for="settingMotto" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
                        Institution Motto (Supports all cases)
                    </label>
                    <input type="text" id="settingMotto" oninput="onSettingsChange()" placeholder="e.g. Excellence & Integrity / excellence in service"
                           class="w-full bg-slate-50 hover:bg-white focus:bg-white border border-slate-200 hover:border-slate-300 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 transition-colors duration-150">
                </div>

                <div>
                    <label for="settingLogo" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
                        Logo Image URL
                    </label>
                    <input type="url" id="settingLogo" oninput="onSettingsChange()" placeholder="https://..."
                           class="w-full bg-slate-50 hover:bg-white focus:bg-white border border-slate-200 hover:border-slate-300 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20 transition-colors duration-150">
                </div>
            </div>

            <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-200">
                <button type="button" onclick="resetToDefaults()" 
                        class="px-4 py-2 text-xs font-bold text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors duration-150">
                    RESET DEFAULT
                </button>
                <button type="button" onclick="toggleSettingsModal(false)" 
                        class="btn-primary px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold uppercase tracking-wider rounded-xl shadow-md">
                    SAVE & CLOSE
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION & PERSISTENT STATE ---
        // --- SYSTEM INSTITUTION CONFIGURATION ---
        // The login page is a consumer of the same institution configuration
        // maintained by SMIS Administration > Institution Settings. It must not
        // maintain a second branding configuration in browser localStorage.
        const API_BASE_URL = (new URLSearchParams(window.location.search).get('api') || '').replace(/\\/$/, '');

        const DEFAULT_CONFIG = {
            name: "Your Institution Name",
            motto: "",
            logo: "",
            primaryColor: "#1e40af",
            accentColor: "#f97316"
        };

        const config = { ...DEFAULT_CONFIG };

        function apiUrl(path) {
            if (!path) return '';
            if (/^https?:\\/\\//i.test(path)) return path;
            return API_BASE_URL + (path.startsWith('/') ? path : '/' + path);
        }

        function resolveLogo(path) {
            if (!path) return '';
            return apiUrl(path);
        }

        function applyBranding() {
            document.getElementById('displayName').textContent = config.name || DEFAULT_CONFIG.name;
            document.getElementById('displayMotto').textContent = config.motto || '';
            const logo = document.getElementById('displayLogo');
            logo.src = resolveLogo(config.logo) || 'https://placehold.co/80x80/f1f5f9/1e293b?text=LOGO';
            logo.onerror = function () {
                this.onerror = null;
                this.src = 'https://placehold.co/80x80/f1f5f9/1e293b?text=LOGO';
            };

            document.getElementById('settingInstName').value = config.name || '';
            document.getElementById('settingMotto').value = config.motto || '';
            document.getElementById('settingLogo').value = config.logo || '';
        }

        async function loadSystemConfiguration() {
            try {
                const response = await fetch(apiUrl('/api/public/institution-settings/active'), {
                    headers: { Accept: 'application/json' }
                });
                if (!response.ok) throw new Error('Institution settings unavailable.');
                const settings = await response.json();

                config.name = settings.institutionName || DEFAULT_CONFIG.name;
                config.motto = settings.motto || DEFAULT_CONFIG.motto;
                config.logo = settings.logoPath || DEFAULT_CONFIG.logo;
                config.primaryColor = settings.primaryColor || DEFAULT_CONFIG.primaryColor;
                config.accentColor = settings.accentColor || DEFAULT_CONFIG.accentColor;

                applyBranding();
                document.documentElement.style.setProperty('--smis-primary', config.primaryColor);
                document.documentElement.style.setProperty('--smis-accent', config.accentColor);
            } catch (error) {
                console.warn('Unable to load active institution configuration.', error);
                applyBranding();
            }
        }

        function onSettingsChange() {
            // This modal is a live preview of the system configuration. Persistent
            // changes belong to the authenticated Administration > Institution Settings
            // screen, preventing an unauthenticated login page from becoming a
            // configuration-write endpoint.
            config.name = document.getElementById('settingInstName').value.trim() || DEFAULT_CONFIG.name;
            config.motto = document.getElementById('settingMotto').value.trim();
            config.logo = document.getElementById('settingLogo').value.trim();

            document.getElementById('displayName').textContent = config.name;
            document.getElementById('displayMotto').textContent = config.motto;
            document.getElementById('displayLogo').src = resolveLogo(config.logo) || 'https://placehold.co/80x80/f1f5f9/1e293b?text=LOGO';
        }

        function resetToDefaults() {
            // Restore the configuration currently stored by SMIS, rather than a
            // browser-local copy or a second source of truth.
            void loadSystemConfiguration();
        }

        function toggleSettingsModal(show) {
            const modal = document.getElementById('settingsModal');
            if (show) {
                void loadSystemConfiguration();
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
                // Discard preview-only edits and return to the server configuration.
                void loadSystemConfiguration();
            }
        }

        void loadSystemConfiguration();

        // --- 2. UNIFORM STRATIFIED GRID CANVAS WATERMARKS ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let dpr = window.devicePixelRatio || 1;

        const COLS = 4; // 4 columns across
        const ROWS = 4; // 4 rows down = 16 evenly spaced sector anchors
        let watermarks = [];

        function initWatermarks() {
            watermarks = [];
            const cellW = window.innerWidth / COLS;
            const cellH = window.innerHeight / ROWS;

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const index = r * COLS + c;
                    watermarks.push({
                        type: index % 2 === 0 ? 'name' : 'motto',
                        col: c,
                        row: r,
                        homeX: (c + 0.5) * cellW,
                        homeY: (r + 0.5) * cellH,
                        radiusX: cellW * 0.22,
                        radiusY: cellH * 0.22,
                        speedX: Math.random() * 0.0007 + 0.0005,
                        speedY: Math.random() * 0.0007 + 0.0005,
                        phaseX: Math.random() * Math.PI * 2,
                        phaseY: Math.random() * Math.PI * 2,
                        angle: Math.random() * Math.PI * 2, // 360-degree initial angle
                        spinSpeed: (Math.random() - 0.5) * 0.0024 + (Math.random() > 0.5 ? 0.0008 : -0.0008), // Constant slow spin
                        fontSize: index % 2 === 0 ? Math.floor(Math.random() * 6) + 22 : Math.floor(Math.random() * 5) + 18,
                        opacity: Math.random() * 0.025 + 0.035
                    });
                }
            }
        }

        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.scale(dpr, dpr);

            // Re-anchor home points to maintain exact screen symmetry on resize
            const cellW = window.innerWidth / COLS;
            const cellH = window.innerHeight / ROWS;
            watermarks.forEach(w => {
                w.homeX = (w.col + 0.5) * cellW;
                w.homeY = (w.row + 0.5) * cellH;
                w.radiusX = cellW * 0.22;
                w.radiusY = cellH * 0.22;
            });
        }

        initWatermarks();
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Subtle ambient background ripples
        const bubbleCount = 8;
        const bubbles = Array.from({ length: bubbleCount }, () => ({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            radius: Math.random() * 40 + 20,
            maxRadius: Math.random() * 90 + 60,
            growthSpeed: Math.random() * 0.12 + 0.05,
            opacity: Math.random() * 0.18 + 0.04,
            vx: (Math.random() - 0.5) * 0.18,
            vy: (Math.random() - 0.5) * 0.18
        }));

        function animateBackground(timestamp) {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

            const time = timestamp || performance.now();

            // 1. Draw perfectly distributed, spinning watermarks in all 16 sectors
            watermarks.forEach(w => {
                // Harmonic smooth orbit around the sector center (prevents drifting or converging into clumps)
                const currentX = w.homeX + Math.sin(time * w.speedX + w.phaseX) * w.radiusX;
                const currentY = w.homeY + Math.cos(time * w.speedY + w.phaseY) * w.radiusY;
                w.angle += w.spinSpeed; // Continuous spin

                ctx.save();
                ctx.translate(currentX, currentY);
                ctx.rotate(w.angle);

                const isName = w.type === 'name';
                const text = isName ? config.name.toUpperCase() : config.motto;

                if (isName) {
                    ctx.font = `800 ${w.fontSize}px Inter, sans-serif`;
                    ctx.fillStyle = `rgba(30, 41, 59, ${w.opacity})`;
                } else {
                    ctx.font = `600 italic ${w.fontSize}px Inter, sans-serif`;
                    ctx.fillStyle = `rgba(37, 99, 235, ${w.opacity * 1.25})`;
                }

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, 0, 0);
                ctx.restore();
            });

            // 2. Draw subtle organic ripples
            bubbles.forEach(b => {
                b.x += b.vx;
                b.y += b.vy;
                b.radius += b.growthSpeed;

                if (b.x < -150) b.x = window.innerWidth + 150;
                if (b.x > window.innerWidth + 150) b.x = -150;
                if (b.y < -150) b.y = window.innerHeight + 150;
                if (b.y > window.innerHeight + 150) b.y = -150;

                if (b.radius > b.maxRadius) {
                    b.radius = Math.random() * 20 + 10;
                }

                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(37, 99, 235, ${Math.max(0, b.opacity * (1 - b.radius / b.maxRadius))})`;
                ctx.lineWidth = 1.2;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(147, 197, 253, ${Math.max(0, (b.opacity * 0.25) * (1 - b.radius / b.maxRadius))})`;
                ctx.fill();
            });

            requestAnimationFrame(animateBackground);
        }

        requestAnimationFrame(animateBackground);

        // --- 3. FORM SUBMISSION ---
        let msgTimeout;
        function showMsg(text, type = 'error') {
            const box = document.getElementById('messageBox');
            clearTimeout(msgTimeout);
            box.textContent = text;
            box.className = `mb-6 p-4 rounded-2xl text-sm border block transition-all duration-300 ${
                type === 'error' 
                    ? 'bg-red-50 border-red-200 text-red-700 shadow-sm' 
                    : 'bg-blue-50 border-blue-200 text-blue-700 shadow-sm'
            }`;
            msgTimeout = setTimeout(() => {
                box.className = 'hidden mb-6 p-4 rounded-2xl text-sm border';
            }, 4500);
        }

        async function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const remember = document.getElementById('rememberMe').checked;

            if (!user || !pass) {
                showMsg('Please fill in all required fields.', 'error');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'AUTHENTICATING...';
            showMsg('Authenticating credentials...', 'info');

            try {
                const response = await fetch(apiUrl('/api/auth/login'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        Accept: 'application/json'
                    },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const payload = await response.json().catch(() => null);
                if (!response.ok) {
                    throw new Error(payload?.message || 'Invalid username or password.');
                }

                if (!payload || typeof payload.accessToken !== 'string' || typeof payload.username !== 'string' || !Array.isArray(payload.roles)) {
                    throw new Error('The authentication service returned an invalid session.');
                }

                if (remember) localStorage.setItem('smis.rememberedUsername', user);
                else localStorage.removeItem('smis.rememberedUsername');

                showMsg('Authentication successful. Loading workspace...', 'info');
                window.parent.postMessage({ type: 'smis-login', session: payload }, window.location.origin);
            } catch (error) {
                showMsg(error instanceof Error ? error.message : 'Unable to sign in.', 'error');
                btn.disabled = false;
                btn.textContent = 'SIGN IN';
            }
        }

        const rememberedUsername = localStorage.getItem('smis.rememberedUsername');
        if (rememberedUsername) {
            document.getElementById('username').value = rememberedUsername;
            document.getElementById('rememberMe').checked = true;
        }
    </script>
</body>
</html>
