[package]
name = "school-management-information-system"
version = "0.1.0"
description = "School Management Information System native desktop client"
authors = ["Kampala School of Health Sciences"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "school_management_information_system_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
